events {
    worker_connections 1024;
}

http {
    # Includes mapping of file name extensions to MIME types of responses
    # and defines the default type.
    include /etc/nginx/mime.types;
    # nginx's bundled mime.types has no entry for .mjs, so it falls back to
    # the default type above. Browsers refuse to run a dynamically imported
    # module served with a non-JS content type (breaks the pdf.js worker).
    types {
        application/javascript mjs;
    }
    default_type application/octet-stream;

    # Performance tweaks for static content serving
    #  - See https://docs.nginx.com/nginx/admin-guide/web-server/serving-static-content/
    sendfile on;
    tcp_nopush on;

    server {
        listen 80;

        server_name _;

        location = /service-info {
            default_type application/json;
            alias /web/dist/static/service-info.json;
        }

        location / {
            root /web/dist;
            try_files $uri $uri/ /index.html;
        }
    }
}
